<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>True Worship</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #111827;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .logo {
        width: 380px;
        height: auto;
      }
      .tagline {
        margin: 0;
        font-size: 15px;
        color: #374151;
      }
      .meta {
        margin: 0;
        font-size: 12px;
        color: #6b7280;
        text-align: center;
        line-height: 1.6;
      }
      .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 4px;
        width: 100%;
        background: #e5e7eb;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #1e40af;
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          margin-left: -40%;
        }
        100% {
          margin-left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../assets/logo/logo.png" alt="True Worship" />
    <p class="tagline">Free, open worship presentation software for churches</p>
    <p class="meta">
      <span id="version">Version</span><br />
      Open source, released under the GNU General Public License v3
    </p>
    <div class="bar"><span></span></div>
    <script>
      const version = new URLSearchParams(location.search).get('version')
      if (version) {
        document.getElementById('version').textContent = 'Version ' + version
      }
    </script>
  </body>
</html>
